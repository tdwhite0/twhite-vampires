<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survivor Arena</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
    }
    #start-overlay span {
      color: #fff;
      font-family: monospace;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="start-overlay"><span>Click to Play</span></div>
  <canvas id="game-canvas"></canvas>
  <script type="module">
    import init from './twhite-topdown.js';

    document.getElementById('start-overlay').addEventListener('click', () => {
      document.getElementById('start-overlay').remove();
      init().catch((error) => {
        if (!error.message.startsWith("Using exceptions for control flow, don't mind me.")) {
          throw error;
        }
      });
    });
  </script>
</body>
</html>
